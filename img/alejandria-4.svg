<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" fill="none" stroke="#2b2418" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <pattern id="tramaA" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#2b2418" stroke-width="1" opacity="0.55"/>
    </pattern>
    <pattern id="tramaR" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#8f3a28" stroke-width="1.3" opacity="0.8"/>
    </pattern>
    <!-- el pilar de la app, dibujado en cada pantalla -->
    <g id="pilar">
      <path d="M100 282 l58 0 M106 292 l46 0"/>
      <path d="M114 304 l0 50 M144 304 l0 50"/>
      <path d="M124 306 l0 46 M134 306 l0 46" stroke-width="1.2" opacity="0.7"/>
      <path d="M100 362 l58 0 M94 372 l70 0"/>
      <path d="M116 306 L142 306 L142 352 L116 352 Z" fill="url(#tramaA)" stroke="none" opacity="0.45"/>
    </g>
  </defs>

  <!-- nube con la carpeta compartida -->
  <path d="M226 196 C192 198 188 152 224 148 C222 106 282 90 306 124 C324 88 384 94 392 136 C430 132 446 192 404 196 C350 200 280 194 226 196 Z" stroke-width="2.4"/>
  <path d="M276 126 L304 125 L312 136 L362 135 L364 180 L274 182 Z" fill="url(#tramaA)" stroke-width="2"/>
  <path d="M276 140 L364 139" stroke-width="1.4" opacity="0.7"/>
  <path d="M308 156 l-10 -2 M308 156 l-2 8 M326 164 l10 2 M326 164 l2 -8" stroke="#8f3a28" stroke-width="2.4"/>
  <path d="M300 152 C310 144 326 146 332 156" stroke="#8f3a28" stroke-width="2.4"/>
  <path d="M334 168 C324 176 306 174 302 164" stroke="#8f3a28" stroke-width="2.4"/>

  <!-- portátil izquierdo -->
  <path d="M44 250 C100 247 160 251 214 249 C216 296 215 340 214 380 C160 382 100 378 46 381 C43 340 44 296 44 250 Z" stroke-width="2.4"/>
  <path d="M24 394 C100 396 160 392 236 394 L228 414 C160 416 100 414 32 415 Z" stroke-width="2.2"/>
  <use href="#pilar" x="-14" y="-12"/>

  <!-- portátil derecho -->
  <path d="M426 250 C480 247 540 251 596 249 C598 296 597 340 596 380 C540 382 480 378 428 381 C425 340 426 296 426 250 Z" stroke-width="2.4"/>
  <path d="M406 394 C480 396 540 392 618 394 L610 414 C540 416 480 414 414 415 Z" stroke-width="2.2"/>
  <use href="#pilar" x="368" y="-12"/>

  <!-- lo que viaja entre cada PC y la carpeta -->
  <path d="M129 238 C140 214 188 200 224 196" stroke="#8f3a28" stroke-width="2.6" stroke-dasharray="8 6"/>
  <path d="M511 238 C500 214 452 200 416 196" stroke="#8f3a28" stroke-width="2.6" stroke-dasharray="8 6"/>
  <path d="M222 190 l-14 -2 l8 12 Z M418 190 l14 -2 l-8 12 Z" fill="#8f3a28" stroke="none"/>
  <path d="M123 244 l6 -14 l8 12 Z M503 244 l8 -14 l8 12 Z" fill="#8f3a28" stroke="none"/>

  <!-- adornos de boceto -->
  <path d="M96 150 l8 0 M100 146 l0 8 M552 118 l8 0 M556 114 l0 8 M48 200 l6 0 M51 197 l0 6" stroke-width="1.6" opacity="0.8"/>
  <circle cx="470" cy="150" r="2.4" fill="#2b2418" stroke="none"/>
  <circle cx="160" cy="118" r="2.4" fill="#2b2418" stroke="none"/>
  <circle cx="596" cy="206" r="2" fill="#2b2418" stroke="none"/>
</svg>
